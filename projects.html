<html>
<head>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
        body {
            background-color: #222;
            color: #bbb;
            font-family: roboto;
            margin: 30px;
        }
        button {
            border: none;
            background-color: #444;
            color: #bbb;
            font-weight: 700;
            padding: 6px;
            border-radius: 4px;
            box-shadow: 3px 3px 4px #1116;
            transition: .4s ease;
        }
        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 4px #1116;
            background-color: #555;
        }
        button:active {
            box-shadow: 5px 5px 4px #1116;
            background-color: #777;
        }
        a {
            text-decoration: none;
            color: #bbb;
        }
        a:visited {
            text-decoration: none;
            color: #bbb;
        }
    </style>
